# 복합 N빵 정산 미니 도메인 온톨로지 — docs/ontology.yaml
# 근거: interviews_union.md의 B절 로그 1~20, C절 관찰 1,2.
# v2.1: 로그 17~20을 반영하여 찬조금, 부분 이용·추가 부담 조정, 관계별 말투, 외부 알림을 추가한다.
# evidence는 문제/행동의 출처이다. 클래스 분리, ID, enum, 상태 전이는 설계 제안이다.
# ID 외 모든 속성과 모든 관계에 evidence를 표시한다. ID는 클래스 근거를 상속한다.
# cardinality, derived, optional, note는 설명용 메타데이터이며 실행되는 검증 규칙이 아니다.
# 이 파일은 개념 모델이다. JSON Schema, DB 스키마, 계산 엔진은 별도 구현한다.


version: "2.1"

classes:
  Participant:
    description: 한 모임의 비용 부담자, 결제자, 정산 담당자 또는 찬조자. 앱 가입 여부와 무관하다.
    evidence: [로그 1, 로그 2, 로그 9, 로그 12, 로그 18]
    attributes:
      participant_id: {type: string, key: true}
      name: {type: string, evidence: [로그 1, 관찰 1]}
      bank_account: {type: string, optional: true, note: "송금받는 사람에게 필요한 경우만 입력한다.", evidence: [로그 13]}
    relations:
      - belongs_to: SettlementSession
        cardinality: "1"
        evidence: [로그 1, 로그 12]
    # 총무/결제자/부담자는 고정된 사람 유형이 아니라 아래 관계로 표현하는 역할이다.

  SettlementSession:
    description: 한 모임 또는 여행의 지출 기록, 분담 계산, 청구 및 입금 확인을 묶는 단위
    evidence: [로그 1, 로그 4, 로그 7, 로그 14]
    attributes:
      session_id: {type: string, key: true}
      total_participants_count: {type: int, derived: true, note: "연결된 Participant 수. 찬조자도 포함할 수 있으므로 실제 분담 인원은 각 SplitRule에서 구한다.", evidence: [로그 8, 로그 12, 로그 18]}
      status: {type: enum, values: [draft, requested, completed], derived: true, note: "입력 검토와 모든 SettlementResult의 처리 상태로 결정한다. completed의 조건은 하단 규칙 참조.", evidence: [로그 4, 로그 14]}
    relations:
      - has: Participant
        cardinality: "1..*"
        evidence: [로그 1, 로그 8, 로그 12]
      - coordinated_by: Participant
        cardinality: "1..*"
        note: "총무 교대가 가능하며 지출 결제자와 같을 필요는 없다. 교대 이력의 상세 설계는 후속 스펙에서 정한다."
        evidence: [로그 1]
      - contains: SettlementRound
        cardinality: "0..*"
        note: "차수를 구분하지 않는 여행 지출도 허용한다."
        evidence: [로그 1, 로그 12]
      - records: Expense
        cardinality: "0..*"
        evidence: [로그 1, 로그 4]

  SettlementRound:
    description: 1차, 2차처럼 참여자와 지출을 구분하는 모임의 차수
    evidence: [로그 12, 로그 15, 로그 17, 로그 18]
    attributes:
      round_id: {type: string, key: true}
      round_number: {type: int, minimum: 1, evidence: [로그 12]}
      total_cost: {type: int, derived: true, note: "이 차수에 속한 유효 Expense.total_amount의 합계. 원 단위.", evidence: [로그 12, 로그 15]}
    relations:
      - belongs_to: SettlementSession
        cardinality: "1"
        evidence: [로그 12]
      - has: RoundParticipation
        cardinality: "0..*"
        evidence: [로그 12, 로그 15]
      - contains: Expense
        cardinality: "0..*"
        evidence: [로그 12, 로그 15]

  RoundParticipation:
    description: 특정 참여자가 특정 차수에 어떻게 참석했는지를 나타내는 연결 정보
    evidence: [로그 12, 로그 15, 로그 17, 로그 18]
    attributes:
      participation_id: {type: string, key: true}
      attendance_note: {type: string, note: "중간 합류/이탈과 관련 사건을 원문 수준으로 기록한다. 정확한 시각을 모르면 추정하지 않는다.", evidence: [로그 12, 로그 15]}
    relations:
      - participant: Participant
        cardinality: "1"
        evidence: [로그 12, 로그 15]
      - in_round: SettlementRound
        cardinality: "1"
        evidence: [로그 12, 로그 15]
    # 한 사람-한 차수 조합은 하나만 둔다. 참석 기록만으로 시간 비례 분담을 적용하지 않는다.

  Expense:
    description: 한 사람이 먼저 결제한 하나의 지출. 영수증 유무와 무관하게 기록하며 정산 중복·누락을 확인하는 기준 단위이다.
    evidence: [로그 1, 로그 2, 로그 4, 로그 8]
    attributes:
      expense_id: {type: string, key: true}
      description: {type: string, evidence: [로그 1, 로그 8]}
      total_amount: {type: int, minimum: 0, note: "사용자가 확인한 결제 총액. 원 단위.", evidence: [로그 1, 로그 5, 로그 8]}
      distributable_amount: {type: int, minimum: 0, derived: true, note: "total_amount에서 확정된 ContributionAllocation 합계를 뺀 금액. 원래 결제 총액은 보존한다.", evidence: [로그 18]}
      source_note: {type: string, optional: true, note: "원본 메시지·메모 등과 대조할 단서. ID만으로 중복이 검출되는 것은 아니다.", evidence: [로그 1, 로그 4, 관찰 1]}
      review_status: {type: enum, values: [needs_review, confirmed, excluded], note: "설계 제안. 중복 여부·항목 합계·부담자 등 검토 후 확정하며 제외 이유를 남긴다.", evidence: [로그 2, 로그 4]}
      review_note: {type: string, optional: true, evidence: [로그 2, 로그 4]}
    relations:
      - belongs_to: SettlementSession
        cardinality: "1"
        evidence: [로그 1, 로그 4]
      - in_round: SettlementRound
        cardinality: "0..1"
        evidence: [로그 12, 로그 15]
      - paid_by: Participant
        cardinality: "1"
        note: "이 지출을 먼저 결제한 사람. 현재 범위에서는 한 지출의 결제자는 한 명이다."
        evidence: [로그 1, 로그 8]
      - supported_by: Receipt
        cardinality: "0..*"
        evidence: [로그 1, 로그 8]
      - contains: Item
        cardinality: "1..*"
        evidence: [로그 2, 로그 6, 관찰 1]
      - funded_by: Contribution
        cardinality: "0..*"
        note: "찬조금은 결제 총액에서 중복 차감하지 않고 항목별 적용 금액을 통해 반영한다."
        evidence: [로그 18]

  Contribution:
    description: 한 지출의 개인별 분담액을 줄이는 찬조금. 소비 분담금 입금과 구분한다.
    evidence: [로그 18]
    attributes:
      contribution_id: {type: string, key: true}
      amount: {type: int, minimum: 1, note: "이 지출에 적용하기로 확인할 찬조금 총액. 로그 18의 사례는 50000원.", evidence: [로그 18]}
      confirmation_status: {type: enum, values: [needs_confirmation, confirmed], note: "설계 제안. 적용 범위와 결제자 기준 자금 처리를 확인한 뒤 확정한다.", evidence: [로그 18]}
      funding_note: {type: string, note: "찬조금의 수령·충당 방식과 적용 합의. 인터뷰에는 실제 전달 경로가 없으므로 임의로 정하지 않는다.", evidence: [로그 18]}
    relations:
      - for_expense: Expense
        cardinality: "1"
        note: "현재 최소 범위는 지출 한 건에 대한 찬조금. 여러 지출에 걸친 공용 찬조금 풀은 후속 확장 대상."
        evidence: [로그 18]
      - contributed_by: Participant
        cardinality: "1"
        note: "찬조 여부만으로 소비 분담 대상 포함/제외를 결정하지 않는다."
        evidence: [로그 18]
      - applied_through: ContributionAllocation
        cardinality: "0..*"
        note: "확정 시 1개 이상. 연결된 적용 금액 합계는 amount와 같아야 한다."
        evidence: [로그 18]

  ContributionAllocation:
    description: 찬조금 중 특정 비용 항목에 적용할 금액. 서로 다른 분담 대상 사이에서 공제 기준을 명확히 하기 위한 설계 개념이다.
    evidence: [로그 18]
    attributes:
      contribution_allocation_id: {type: string, key: true}
      amount: {type: int, minimum: 1, note: "해당 항목에 적용하는 찬조금. 원 단위.", evidence: [로그 18]}
      basis_note: {type: string, note: "사용자가 확인한 항목별 공제 기준. 술값/음식값에 어떤 비율로 적용할지는 인터뷰만으로 정하지 않는다.", evidence: [로그 18]}
    relations:
      - from_contribution: Contribution
        cardinality: "1"
        evidence: [로그 18]
      - to_item: Item
        cardinality: "1"
        evidence: [로그 18]

  Receipt:
    description: 결제 금액과 품목을 확인하는 영수증 근거 자료. OCR 처리 결과 자체와 동일시하지 않는다.
    evidence: [로그 1, 로그 8, 관찰 1]
    attributes:
      receipt_id: {type: string, key: true}
      image_reference: {type: string, optional: true, note: "촬영본이 있으면 그 위치를 기록한다.", evidence: [로그 1, 관찰 1]}
      recorded_total_amount: {type: int, minimum: 0, note: "영수증에서 읽은 금액. Expense.total_amount와 대조한다.", evidence: [로그 1, 로그 8, 관찰 1]}
    relations:
      - supports: Expense
        cardinality: "1"
        evidence: [로그 1, 로그 8]
      - documents: Item
        cardinality: "0..*"
        note: "확인 가능한 품목만 연결하며 품목 미확인 상태를 임의로 채우지 않는다."
        evidence: [로그 1, 로그 6, 관찰 1]

  Item:
    description: 한 지출 안에서 부담 대상을 구분할 수 있는 품목 또는 비용 항목
    evidence: [로그 2, 로그 6, 로그 7, 로그 15, 로그 17, 로그 19, 로그 20]
    attributes:
      item_id: {type: string, key: true}
      name: {type: string, evidence: [로그 1, 로그 6]}
      amount: {type: int, minimum: 0, note: "품목의 합계 금액. 영수증 단가와 혼동하지 않는다.", evidence: [로그 2, 로그 6]}
      category: {type: string, optional: true, examples: [주류, 음료, 디저트, 식사], note: "술값 제외 등의 대상 확인에 사용한다. 이름만으로 분류를 확정하지 않는다.", evidence: [로그 17, 로그 19, 로그 20]}
      distributable_amount: {type: int, minimum: 0, derived: true, note: "amount에서 이 항목에 적용된 확정 ContributionAllocation 금액을 뺀 값.", evidence: [로그 18]}
      occurrence_note: {type: string, optional: true, note: "예: 특정 참여자가 나간 뒤 추가 주문한 술. 정확한 시각 없이 전후 관계로도 표현 가능.", evidence: [로그 15]}
    relations:
      - belongs_to: Expense
        cardinality: "1"
        evidence: [로그 1, 로그 6]
      - allocated_by: SplitRule
        cardinality: "1"
        evidence: [로그 6, 로그 7, 관찰 1]
      - has_exception: ItemException
        cardinality: "0..*"
        evidence: [로그 9, 로그 15, 로그 17, 로그 18, 로그 20]
      - has_contribution_allocation: ContributionAllocation
        cardinality: "0..*"
        evidence: [로그 18]

  SplitRule:
    description: 특정 항목을 누구에게 어떤 방식으로 분담시킬지 정한 기준
    evidence: [로그 6, 로그 7, 로그 9, 로그 12, 로그 15, 로그 18, 로그 19, 로그 20]
    attributes:
      rule_id: {type: string, key: true}
      method: {type: enum, values: [equal, explicit_amount], note: "equal은 찬조금 및 고정 금액 조정 후 잔액을 나머지 대상자에게 균등 분담한다. explicit_amount는 개인별 합의 금액을 Allocation에 기록한다. 예외 적용 순서는 하단 규칙 참조.", evidence: [로그 6, 로그 7, 로그 8, 로그 18, 로그 19, 로그 20]}
      confirmation_status: {type: enum, values: [needs_confirmation, confirmed], note: "중도 합류·이탈 등의 기준이 모호하면 먼저 확인한다.", evidence: [로그 12, 로그 15]}
      basis_note: {type: string, note: "소비자 구분, 분담 합의, 단수 처리 등의 근거.", evidence: [로그 6, 로그 10, 로그 15, 로그 16]}
    relations:
      - for_item: Item
        cardinality: "1"
        evidence: [로그 6, 로그 7]
      - applies_to: Participant
        cardinality: "1..*"
        note: "예외 적용 전 기본 부담 대상자. 모임 참석자 전체와 항상 같지는 않다."
        evidence: [로그 6, 로그 8]
      - produces: Allocation
        cardinality: "0..*"
        note: "확정 시 유효한 최종 분담 결과를 생성한다."
        evidence: [로그 5, 로그 6, 로그 7]

  ItemException:
    description: 특정 항목과 특정 사람에 적용되는 분담 제외, 합의 금액 조정 또는 대신 부담 조건
    evidence: [로그 9, 로그 15, 로그 17, 로그 18, 로그 20]
    attributes:
      exception_id: {type: string, key: true}
      kind: {type: enum, values: [exclude, fixed_amount, covered_by_other], note: "exclude는 분담 대상 제외, fixed_amount는 부분 이용·추가 부담을 반영한 합의 금액 지정, covered_by_other는 해당자의 몫을 다른 사람이 인수함.", evidence: [로그 9, 로그 15, 로그 17, 로그 18, 로그 20]}
      fixed_amount: {type: int, minimum: 0, optional: true, note: "kind=fixed_amount이면 필수, 그 외에는 사용하지 않는다. 증감분이 아닌 해당 항목의 합의 소비 부담액이다. 다른 사람 몫의 인수는 이후 별도로 더한다.", evidence: [로그 18, 로그 20]}
      reason: {type: string, evidence: [로그 9, 로그 15, 로그 17, 로그 18, 로그 20]}
      confirmation_status: {type: enum, values: [needs_confirmation, confirmed], note: "설계 제안. 발화 해석과 비용 조율이 끝나야 적용한다. 맥주 한 잔이라는 말만으로 부담액을 추정하지 않는다.", evidence: [로그 12, 로그 15, 로그 18, 로그 20]}
    relations:
      - applies_to: Item
        cardinality: "1"
        evidence: [로그 9, 로그 15, 로그 17, 로그 18, 로그 20]
      - affects: Participant
        cardinality: "1"
        note: "예외 대상자를 식별한다. 여러 사람이면 예외를 각각 기록한다."
        evidence: [로그 9, 로그 15, 로그 17, 로그 18, 로그 20]
      - covered_by: Participant
        cardinality: "0..1"
        note: "covered_by_other일 때만 필수. affects와 서로 다른 사람이어야 한다."
        evidence: [로그 9]

  Allocation:
    description: 한 항목에 대해 한 참여자가 최종적으로 부담하는 금액과 그 근거
    evidence: [로그 2, 로그 5, 로그 6, 로그 7, 로그 9]
    attributes:
      allocation_id: {type: string, key: true}
      amount: {type: int, minimum: 0, note: "찬조금 공제·예외·대신 부담·단수 조정을 반영한 최종 원 단위 소비 분담액. 결제자의 본인 부담도 포함하며 찬조금 자체는 중복 포함하지 않는다.", evidence: [로그 5, 로그 6, 로그 9, 로그 10, 로그 18, 로그 20]}
      basis_note: {type: string, note: "원래 몫, 예외와 단수 조정 등 결과를 설명할 근거.", evidence: [로그 2, 로그 15, 로그 16]}
    relations:
      - for_item: Item
        cardinality: "1"
        evidence: [로그 6, 로그 7]
      - assigned_to: Participant
        cardinality: "1"
        evidence: [로그 2, 로그 6, 로그 9]
      - based_on: SplitRule
        cardinality: "1"
        evidence: [로그 6, 로그 7]

  SettlementResult:
    description: 한 지출에 대해 한 참여자가 그 지출의 결제자에게 보내야 할 금액과 청구 처리 상태
    evidence: [로그 1, 로그 2, 로그 4, 로그 11, 로그 14]
    attributes:
      result_id: {type: string, key: true}
      amount_due: {type: int, minimum: 0, derived: true, note: "동일 Expense에서 debtor에게 배정된 Allocation 합계. 결제자의 본인 부담은 청구하지 않는다.", evidence: [로그 2, 로그 5, 로그 6]}
      explanation: {type: string, note: "연결된 항목·분담 기준·예외에서 구성하는 산출 근거.", evidence: [로그 15, 로그 16]}
      request_status: {type: enum, values: [draft, requested, completed], note: "청구 기록의 처리 상태. 실제 입금 확인 여부와 구분한다.", evidence: [로그 4, 로그 14]}
      requested_at: {type: string, format: date-time, optional: true, evidence: [로그 11, 로그 13]}
