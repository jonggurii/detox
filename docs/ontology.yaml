      expected_payment_note: {type: string, optional: true, note: "예: 월급날 이후. 상대가 말하지 않은 날짜를 임의로 생성하지 않는다.", evidence: [로그 13]}
      reminder_handling: {type: enum, values: [undecided, personal_follow_up, external_service_only], note: "설계 제안. 외부 서비스 알림을 쓰는 경우 사용자 확인 없이 개인 재요청을 중복 제안하지 않는다. 서비스 연동·자동 발송 기능을 뜻하지 않는다.", evidence: [로그 11, 로그 13, 로그 17, 로그 18, 로그 19]}
    relations:
      - for_expense: Expense
        cardinality: "1"
        evidence: [로그 1, 로그 2, 로그 4]
      - debtor: Participant
        cardinality: "1"
        evidence: [로그 2, 로그 11, 로그 13]
      - creditor: Participant
        cardinality: "1"
        note: "for_expense의 paid_by와 일치한다. 세션 총무로 고정하지 않는다."
        evidence: [로그 1, 로그 8]
      - based_on: Allocation
        cardinality: "1..*"
        evidence: [로그 2, 로그 5, 로그 6]
      - has: PaymentRecord
        cardinality: "0..*"
        evidence: [로그 14, 관찰 1]

  PaymentRecord:
