      reminder_id: {type: string, key: true}
      text: {type: string, optional: true, note: "개인 메시지는 사용자가 확인한 문구를 기록한다. 외부 알림의 원문을 모르면 비워 둔다. 자동 생성은 구현 후보이다.", evidence: [로그 11, 로그 13, 로그 17, 로그 18, 로그 19, 로그 20]}
      delivery_mode: {type: enum, values: [personal_message, external_service_notification], note: "개인 연락과 기존 서비스 알림을 구분하는 설계 값. 알림이 실제 발송되었다는 뜻은 아니다.", evidence: [로그 17, 로그 18, 로그 19, 로그 20]}
      tone: {type: string, optional: true, examples: [유쾌한, 정중한], note: "사용자가 원하는 말투. 고정 3종 분류나 관계에 따른 자동 결정을 강제하지 않는다.", evidence: [로그 17, 로그 18, 로그 20]}
      relationship_context: {type: string, optional: true, examples: [친구, 직장 동료], note: "이 메시지의 발신자와 수신자 사이 맥락. 수신자의 고정 성격으로 저장하지 않는다.", evidence: [로그 17, 로그 18, 로그 20]}
      follow_up_note: {type: string, optional: true, note: "하루 뒤, 월요일 출근 후, 상대가 말한 송금 가능 시점 등. 로그 19의 24시간은 해당 사례의 기존 서비스 동작이며 새 앱의 고정 정책이 아니다.", evidence: [로그 11, 로그 13, 로그 17, 로그 18, 로그 19]}
      delivery_status: {type: enum, values: [planned, sent], note: "설계 제안. 발송 여부를 확인한 경우만 sent로 기록한다.", evidence: [로그 11, 로그 17, 로그 18, 로그 19]}
    relations:
