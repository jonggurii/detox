Receipt` 클래스와 `ItemException` 관계가 완벽히 포함된 미니 도메인 온톨로지입니다.

```yaml
# 영수증 OCR & 복합 N빵 정산 봇 미니 도메인 온톨로지 (docs/ontology.yaml)
version: 1.1

classes:
  User:
    description: 모임의 총무(정산 담당자) 또는 일반 참석자
    evidence: [로그 1, 로그 2]
    attributes:
      user_id: {type: string, key: true}
      name: {type: string}
      bank_account: {type: string, note: "송금받을 계좌 정보", evidence: [로그 1]}
    relations:
      - creates: SettlementSession
        evidence: [로그 1]

  SettlementSession:
    description: 전체 모임 정산 세션 (1차~N차 총괄)
    evidence: [로그 1, 로그 3]
    attributes:
      session_id: {type: string, key: true}
      total_participants_count: {type: int, evidence: [로그 1]}
      status: {type: enum, values: [calculating, requested, completed]}
    relations:
      - contains: SettlementRound
        evidence: [로그 1]
      - requires: ReminderMessage
        evidence: [로그 4, 로그 5]

  SettlementRound:
    description: 개별 차수 (1차, 2차 등) 모임 단위
    evidence: [로그 1, 로그 2]
    attributes:
      round_number: {type: int, minimum: 1, evidence: [로그 1]}
      total_cost: {type: int, evidence: [로그 1]}
      excluded_members: {type: array, items: {type: string}, note: "해당 차수 전체 이탈자", evidence: [로그 2]}
    relations:
      - belongs_to: SettlementSession
        evidence: [로그 1]
      - includes: Receipt
        evidence: [로그 1]
      - has_exception: ItemException
        evidence: [로그 3]

  Receipt:
    description: 영수증 촬영을 통해 OCR로 파싱된 결제 정보
    evidence: [로그 1]
    attributes:
      receipt_id: {type: string, key: true}
      store_name: {type: string, evidence: [로그 1]}
      ocr_total_amount: {type: int, evidence: [로그 1]}
      parsed_items: {type: array, items: {type: object}, evidence: [로그 1]}

  ItemException:
    description: 특정 항목(예: 술값, 디저트 등)에 대한 미이용/제외 조건
    evidence: [로그 3]
    attributes:
      item_name: {type: string, evidence: [로그 3]}
      amount: {type: int, evidence: [로그 3]}
      excluded_members_count: {type: int, evidence: [로그 3]}

  ReminderMessage:
    description: 상대방 성향별로 생성되는 정산 독촉 카톡 메시지
    evidence: [로그 4, 로그 5]
    attributes:
      tone: {type: enum, values: [polite_formal, friendly_casual, humorous], evidence: [로그 5]}
      generated_text: {type: string, evidence: [로그 5]}
    relations:
      - sent_for: SettlementSession
        evidence: [로그 4]

# 범위 밖 (Out of Scope): 은행 이체 자동 실행 API 직접 연동, 종이 영수증 훼손 복원 OCR
# 핵심 흐름: User --> SettlementSession --> SettlementRound (Receipt + ItemException) --> Python 계산 엔진 --> ReminderMessage