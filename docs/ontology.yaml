# 복합 N빵 정산 미니 도메인 온톨로지 — docs/ontology.yaml
# 근거: interviews_union.md의 B절 로그 1~20, C절 관찰 1,2.
# v3.1: 클래스와 관계 대상은 영문 식별자, 한글 대표 용어는 주석으로 표기한다. 속성·관계 이름·상태값·설명은 word.md의 한글 표현을 유지한다.
# evidence는 문제/행동의 출처이다. 클래스 분리, ID, enum, 상태 전이는 설계 제안이다.
# ID 외 모든 속성과 모든 관계에 evidence를 표시한다. ID는 클래스 근거를 상속한다.
# cardinality, derived, optional, note는 설명용 메타데이터이며 실행되는 검증 규칙이 아니다.
# 이 파일은 개념 모델이다. JSON Schema, DB 스키마, 계산 엔진은 별도 구현한다.


version: "3.1"

classes:
  Participant: # 참여자
    description: 이 모임 정산에 연결된 사람. 비용 부담자·결제자·담당자·찬조자 역할을 맡을 수 있다.
    evidence: [로그 1, 로그 2, 로그 9, 로그 12, 로그 18]
    attributes:
      참여자 ID: {type: string, key: true}
      이름: {type: string, evidence: [로그 1, 관찰 1]}
      송금받을 계좌: {type: string, optional: true, note: "송금받는 사람에게 필요한 경우만 입력한다.", evidence: [로그 13]}
    relations:
      - 소속 모임 정산: SettlementSession # 모임 정산
        cardinality: "1"
        evidence: [로그 1, 로그 12]
    # 총무/결제자/부담자는 고정된 사람 유형이 아니라 아래 관계로 표현하는 역할이다.

  SettlementSession: # 모임 정산
    description: 한 모임이나 여행의 결제 내역, 비용 나누기, 송금 요청, 입금 확인을 묶는 전체 단위.
    evidence: [로그 1, 로그 4, 로그 7, 로그 14]
    attributes:
      모임 정산 ID: {type: string, key: true}
      연결된 참여자 수: {type: int, derived: true, note: "연결된 참여자 수. 찬조자도 포함할 수 있으므로 실제 분담 인원은 각 비용 나누는 기준에서 구한다.", evidence: [로그 8, 로그 12, 로그 18]}
      모임 정산 상태: {type: enum, values: [초안, 요청됨, 완료], derived: true, note: "입력 검토와 모든 송금 요청 내역의 처리 상태로 결정한다. 완료의 조건은 하단 규칙 참조.", evidence: [로그 4, 로그 14]}
    relations:
      - 연결된 참여자: Participant # 참여자
        cardinality: "1..*"
        evidence: [로그 1, 로그 8, 로그 12]
      - 정산 담당자: Participant # 참여자
        cardinality: "1..*"
        note: "총무 교대가 가능하며 지출 결제자와 같을 필요는 없다. 교대 이력의 상세 설계는 후속 스펙에서 정한다."
        evidence: [로그 1]
      - 포함된 모임 차수: SettlementRound # 모임 차수
        cardinality: "0..*"
        note: "차수를 구분하지 않는 여행 지출도 허용한다."
        evidence: [로그 1, 로그 12]
      - 기록된 결제 내역: Expense # 결제 내역
        cardinality: "0..*"
        evidence: [로그 1, 로그 4]

  SettlementRound: # 모임 차수
    description: 1차 식사·2차 술자리처럼 참석자와 결제 내역을 구분하는 자리.
    evidence: [로그 12, 로그 15, 로그 17, 로그 18]
    attributes:
      모임 차수 ID: {type: string, key: true}
      차수 번호: {type: int, minimum: 1, evidence: [로그 12]}
      이 차수의 총결제액: {type: int, derived: true, note: "이 차수에 속한 유효 Expense.결제한 총금액의 합계. 원 단위.", evidence: [로그 12, 로그 15]}
    relations:
      - 소속 모임 정산: SettlementSession # 모임 정산
        cardinality: "1"
        evidence: [로그 12]
      - 차수별 참석 기록: RoundParticipation # 차수별 참석 기록
        cardinality: "0..*"
        evidence: [로그 12, 로그 15]
      - 이 차수의 결제 내역: Expense # 결제 내역
        cardinality: "0..*"
        evidence: [로그 12, 로그 15]

  RoundParticipation: # 차수별 참석 기록
    description: 특정 사람이 어느 차수에 어떻게 참석했는지 남긴 기록. 중간 합류·이탈도 기록한다.
    evidence: [로그 12, 로그 15, 로그 17, 로그 18]
    attributes:
      참석 기록 ID: {type: string, key: true}
      합류·이탈 메모: {type: string, note: "중간 합류/이탈과 관련 사건을 원문 수준으로 기록한다. 정확한 시각을 모르면 추정하지 않는다.", evidence: [로그 12, 로그 15]}
    relations:
      - 참석한 사람: Participant # 참여자
        cardinality: "1"
        evidence: [로그 12, 로그 15]
      - 참석한 차수: SettlementRound # 모임 차수
        cardinality: "1"
        evidence: [로그 12, 로그 15]
    # 한 사람-한 차수 조합은 하나만 둔다. 참석 기록만으로 시간 비례 분담을 적용하지 않는다.

  Expense: # 결제 내역
    description: 한 사람이 먼저 결제한 하나의 비용 기록. 영수증이 없어도 기록할 수 있다.
    evidence: [로그 1, 로그 2, 로그 4, 로그 8]
    attributes:
      결제 내역 ID: {type: string, key: true}
      결제 내용: {type: string, evidence: [로그 1, 로그 8]}
      결제한 총금액: {type: int, minimum: 0, note: "사용자가 확인한 결제 총액. 원 단위.", evidence: [로그 1, 로그 5, 로그 8]}
      찬조금 뺀 결제 금액: {type: int, minimum: 0, derived: true, note: "결제한 총금액에서 확정된 항목별 찬조금 적용 합계를 뺀 금액. 원래 결제 총액은 보존한다.", evidence: [로그 18]}
      원본 대조 메모: {type: string, optional: true, note: "원본 메시지·메모 등과 대조할 단서. ID만으로 중복이 검출되는 것은 아니다.", evidence: [로그 1, 로그 4, 관찰 1]}
      결제 내역 검토 상태: {type: enum, values: [검토 필요, 검토 확정, 제외], note: "설계 제안. 중복 여부·항목 합계·부담자 등 검토 후 확정하며 제외 이유를 남긴다.", evidence: [로그 2, 로그 4]}
      검토 메모: {type: string, optional: true, evidence: [로그 2, 로그 4]}
    relations:
      - 소속 모임 정산: SettlementSession # 모임 정산
        cardinality: "1"
        evidence: [로그 1, 로그 4]
      - 결제가 발생한 차수: SettlementRound # 모임 차수
        cardinality: "0..1"
        evidence: [로그 12, 로그 15]
      - 먼저 결제한 사람: Participant # 참여자
        cardinality: "1"
        note: "이 지출을 먼저 결제한 사람. 현재 범위에서는 한 지출의 결제자는 한 명이다."
        evidence: [로그 1, 로그 8]
      - 결제를 확인할 영수증: Receipt # 영수증
        cardinality: "0..*"
        evidence: [로그 1, 로그 8]
      - 포함된 비용 항목: Item # 비용 항목
        cardinality: "1..*"
        evidence: [로그 2, 로그 6, 관찰 1]
      - 적용할 찬조금: Contribution # 찬조금
        cardinality: "0..*"
        note: "찬조금은 결제 총액에서 중복 차감하지 않고 항목별 적용 금액을 통해 반영한다."
        evidence: [로그 18]

  Contribution: # 찬조금
    description: 특정 결제 내역에서 참여자들이 나눠 낼 금액을 줄여주는 지원금. 소비 몫의 송금과 구분한다.
    evidence: [로그 18]
    attributes:
      찬조금 ID: {type: string, key: true}
      찬조금 총액: {type: int, minimum: 1, note: "이 지출에 적용하기로 확인할 찬조금 총액. 로그 18의 사례는 50000원.", evidence: [로그 18]}
      찬조금 확정 상태: {type: enum, values: [확인 필요, 확정], note: "설계 제안. 적용 범위와 결제자 기준 자금 처리를 확인한 뒤 확정한다.", evidence: [로그 18]}
      찬조금 전달·충당 메모: {type: string, note: "찬조금의 수령·충당 방식과 적용 합의. 인터뷰에는 실제 전달 경로가 없으므로 임의로 정하지 않는다.", evidence: [로그 18]}
    relations:
      - 찬조금을 적용할 결제 내역: Expense # 결제 내역
        cardinality: "1"
        note: "현재 최소 범위는 지출 한 건에 대한 Contribution. 여러 지출에 걸친 공용 찬조금 풀은 후속 확장 대상."
        evidence: [로그 18]
      - 찬조한 사람: Participant # 참여자
        cardinality: "1"
        note: "찬조 여부만으로 소비 분담 대상 포함/제외를 결정하지 않는다."
        evidence: [로그 18]
      - 항목별 찬조금 적용 내역: ContributionAllocation # 항목별 찬조금 적용
        cardinality: "0..*"
        note: "확정 시 1개 이상. 연결된 적용 금액 합계는 찬조금 총액와 같아야 한다."
        evidence: [로그 18]

  ContributionAllocation: # 항목별 찬조금 적용
    description: 찬조금 중 특정 비용 항목에 적용하기로 정한 금액과 근거.
    evidence: [로그 18]
    attributes:
      찬조금 적용 ID: {type: string, key: true}
      이 항목에 적용할 찬조금: {type: int, minimum: 1, note: "해당 항목에 적용하는 Contribution. 원 단위.", evidence: [로그 18]}
      찬조금 적용 근거: {type: string, note: "사용자가 확인한 항목별 공제 기준. 술값/음식값에 어떤 비율로 적용할지는 인터뷰만으로 정하지 않는다.", evidence: [로그 18]}
    relations:
      - 가져온 찬조금: Contribution # 찬조금
        cardinality: "1"
        evidence: [로그 18]
      - 찬조금을 적용할 비용 항목: Item # 비용 항목
        cardinality: "1"
        evidence: [로그 18]

  Receipt: # 영수증
    description: 결제 금액과 품목을 확인하는 증빙 자료. OCR 추출 결과 자체와 구분한다.
    evidence: [로그 1, 로그 8, 관찰 1]
    attributes:
      영수증 ID: {type: string, key: true}
      영수증 이미지 위치: {type: string, optional: true, note: "촬영본이 있으면 그 위치를 기록한다.", evidence: [로그 1, 관찰 1]}
      영수증에서 읽은 총금액: {type: int, minimum: 0, note: "영수증에서 읽은 금액. Expense.결제한 총금액와 대조한다.", evidence: [로그 1, 로그 8, 관찰 1]}
    relations:
      - 증빙하는 결제 내역: Expense # 결제 내역
        cardinality: "1"
        evidence: [로그 1, 로그 8]
      - 확인할 수 있는 비용 항목: Item # 비용 항목
        cardinality: "0..*"
        note: "확인 가능한 품목만 연결하며 품목 미확인 상태를 임의로 채우지 않는다."
        evidence: [로그 1, 로그 6, 관찰 1]

  Item: # 비용 항목
    description: 한 결제 내역 안에서 누구에게 어떤 기준으로 나눌지 구분하는 비용. 식사비·술값 등이 해당한다.
    evidence: [로그 2, 로그 6, 로그 7, 로그 15, 로그 17, 로그 19, 로그 20]
    attributes:
      비용 항목 ID: {type: string, key: true}
      항목 이름: {type: string, evidence: [로그 1, 로그 6]}
      항목 금액: {type: int, minimum: 0, note: "품목의 합계 금액. 영수증 단가와 혼동하지 않는다.", evidence: [로그 2, 로그 6]}
      항목 종류: {type: string, optional: true, examples: [주류, 음료, 디저트, 식사], note: "술값 제외 등의 대상 확인에 사용한다. 이름만으로 분류를 확정하지 않는다.", evidence: [로그 17, 로그 19, 로그 20]}
      찬조금 뺀 항목 금액: {type: int, minimum: 0, derived: true, note: "항목 금액에서 이 항목에 적용된 확정 항목별 찬조금 적용 금액을 뺀 값.", evidence: [로그 18]}
      비용 발생 메모: {type: string, optional: true, note: "예: 특정 참여자가 나간 뒤 추가 주문한 술. 정확한 시각 없이 전후 관계로도 표현 가능.", evidence: [로그 15]}
    relations:
      - 소속 결제 내역: Expense # 결제 내역
        cardinality: "1"
        evidence: [로그 1, 로그 6]
      - 비용 나누는 기준: SplitRule # 비용 나누는 기준
        cardinality: "1"
        evidence: [로그 6, 로그 7, 관찰 1]
      - 적용할 개인별 부담 조정: ItemException # 개인별 부담 조정
        cardinality: "0..*"
        evidence: [로그 9, 로그 15, 로그 17, 로그 18, 로그 20]
      - 적용할 항목별 찬조금: ContributionAllocation # 항목별 찬조금 적용
        cardinality: "0..*"
        evidence: [로그 18]

  SplitRule: # 비용 나누는 기준
    description: 특정 비용 항목을 누가 어떤 방식으로 나눠 낼지 정한 기준.
    evidence: [로그 6, 로그 7, 로그 9, 로그 12, 로그 15, 로그 18, 로그 19, 로그 20]
    attributes:
      비용 기준 ID: {type: string, key: true}
      나누는 방식: {type: enum, values: [남은 금액 똑같이 나누기, 사람별 금액 정하기], note: "남은 금액 똑같이 나누기는 찬조금 및 고정 금액 조정 후 잔액을 나머지 대상자에게 균등 분담한다. 사람별 금액 정하기는 개인별 합의 금액을 항목별 개인 부담액에 기록한다. 예외 적용 순서는 하단 규칙 참조.", evidence: [로그 6, 로그 7, 로그 8, 로그 18, 로그 19, 로그 20]}
      비용 기준 확정 상태: {type: enum, values: [확인 필요, 확정], note: "중도 합류·이탈 등의 기준이 모호하면 먼저 확인한다.", evidence: [로그 12, 로그 15]}
      비용 나누는 근거: {type: string, note: "소비자 구분, 분담 합의, 단수 처리 등의 근거.", evidence: [로그 6, 로그 10, 로그 15, 로그 16]}
    relations:
      - 나눌 비용 항목: Item # 비용 항목
        cardinality: "1"
        evidence: [로그 6, 로그 7]
      - 나눠 낼 기본 대상자: Participant # 참여자
        cardinality: "1..*"
        note: "예외 적용 전 기본 부담 대상자. 모임 참석자 전체와 항상 같지는 않다."
        evidence: [로그 6, 로그 8]
      - 계산된 개인 부담액: Allocation # 항목별 개인 부담액
        cardinality: "0..*"
        note: "확정 시 유효한 최종 분담 결과를 생성한다."
        evidence: [로그 5, 로그 6, 로그 7]

  ItemException: # 개인별 부담 조정
    description: 특정 사람과 비용 항목에 적용하는 부담 제외, 합의 소비 몫 또는 대신 부담 조건.
    evidence: [로그 9, 로그 15, 로그 17, 로그 18, 로그 20]
    attributes:
      부담 조정 ID: {type: string, key: true}
