# 구현 시 검증할 제약 — 아래는 인터뷰 문제에서 도출한 설계 제안이다.
# 1. 모든 관계 대상은 이 파일의 클래스이다. 연결된 객체는 같은 모임 정산에 속해야 한다.
# 2. 결제 내역에 연결된 영수증과 비용 항목 및 모임 차수는 그 지출과 모순되어서는 안 된다.
# 3. 하나의 비용 항목에는 하나의 유효 비용 나누는 기준이 있고, (비용 항목, 참여자)별 최종 항목별 개인 부담액은 하나다.
# 4. 먼저 찬조금 적용을 확정한다. 다음 이 항목은 부담 안 함 대상자를 뺀다.
#    남은 금액 똑같이 나누기: 이 항목의 내 몫 정하기 대상자의 합의액을 먼저 배정하고 잔액을 나머지 대상자에게 균등 분배한다.
#    사람별 금액 정하기: 확인된 개인별 금액을 입력하며 이 항목은 부담 안 함 대상의 소비 몫은 0,
#    이 항목의 내 몫 정하기 대상의 소비 몫은 그 합의액과 같아야 한다. 예외를 금액에 다시 가감하지 않는다.
#    두 방식 모두 기본 소비 몫을 구한 뒤 다른 사람이 대신 내기로 해당 몫을 이전한다.
#    같은 사람·항목에 여러 부담 조정 방식을 중복 적용하거나 대신 부담의 순환·연쇄가 생기면 확인을 요청한다.
#    이 항목의 합의 소비 몫 합계가 분담 가능액보다 크거나, 잔액은 있으나 부담자가 없으면 확정할 수 없다.
# 5. 1원 미만 몫은 부동소수점 오차 없이 계산하고, 원 단위 차액의 부담자를 확인한다.
#    소액 미청구도 비용의 소멸로 처리하지 않는다. 결제자 등이 흡수한 금액을 항목별 개인 부담액과 근거에 남긴다.
#    100원 반올림을 필수 정책으로 두지 않는다. 사용자 선택과 잔액 처리는 후속 스펙에서 확정한다.
# 6. 유효 청구는 (결제 내역, 돈을 보낼 사람, 돈을 받을 사람)별 하나. 돈을 받을 사람 = Expense.먼저 결제한 사람, 돈을 보낼 사람 != 돈을 받을 사람.
#    근거가 되는 항목별 부담액은 그 결제 내역과 돈을 보낼 사람의 항목별 개인 부담액 전부에 정확히 대응해야 한다.
#    결제자 본인 몫 및 최종 부담액 0원의 참여자에게 송금을 청구하지 않는다.
# 7. 청구 금액 합계 + 결제자 본인 항목별 개인 부담액 합계 + 확정 찬조금 적용액 = Expense.결제한 총금액.
#    여러 결제자의 지출은 각각 유지한다. 모임 정산 전체 상계·최소 송금 최적화는 이번 모델의 필수가 아니다.
# 8. 검토 미완료 지출·미확정 규칙·미확정 예외・미확정 찬조금이 있으면 청구를 확정하지 않는다.
#    금액/날짜/이름이 비슷하다는 이유만으로 지출을 자동 삭제하지 않는다.
# 9. 완료 청구는 입금 확인 상태=입금 확인 완료여야 한다. 입금 확인 완료는 담당자 대조로 확인된 입금만 합산하여 판단한다.
#     하나의 실제 송금 내역을 여러 입금 확인 기록에 대응시킬 때 대응 금액 합계가 실제 입금액을 넘으면 안 된다.
#     부분입금·초과입금·환불 처리의 상세 상태는 현 인터뷰만으로 확정하지 않는다.
# 10. 모임 정산 완료는 모든 지출 검토 종료 + 유효 지출의 계산/청구 누락 없음 + 모든 유효 청구 완료로 판단한다.
#     입금 확인이 안 된 것을 실제 미입금으로 단정하지 않는다. 재요청 전 확인 상태와 약속 시점을 검토한다.
# 11. 청구 후 근거 금액을 바꿀 때 기존 요청/입금 연결을 조용히 덮어쓰지 않는다.
#     변경 이력·청구 버전·재안내 방식은 구현 스펙에서 정의한다.
# 12. 하나의 확정 Contribution.찬조금 총액 = 그 ContributionAllocation.이 항목에 적용할 찬조금 합계.
#     항목별 찬조금 적용의 확정 여부는 연결된 Contribution.찬조금 확정 상태를 따른다.
#     ContributionAllocation.찬조금을 적용할 비용 항목은 Contribution.찬조금을 적용할 결제 내역에 속해야 한다.
#     (찬조금, 비용 항목)별 유효 적용 기록은 하나이며 항목별 찬조금 합계는 항목 금액을 넘지 않는다.
#     식사/술에 찬조금을 적용하는 비율은 자동 추정하지 않는다. 동일 분담 대상/기준이면
#     전체 비용을 하나의 비용 항목으로 표현할 수 있고, 대상/기준이 다르면 항목별 공제액을 확인한다.
# 13. ReminderMessage.다시 안내할 송금 요청의 돈을 보낼 사람은 안내를 받는 사람과 일치해야 한다.
#     개인 메시지라면 안내를 보내는 사람과 재안내 문구가 필수이며, 외부 알림 원문·발송 시각은 모르면 추정하지 않는다.
#     재안내 처리 방식이 기존 서비스 알림만 사용인 송금 요청에는 사용자의 처리 방식 변경 없이 개인 메시지를 추가하지 않는다.

# 설계 예시 — 인터뷰의 실제 금액/계산 결과가 아닌 설명용 가상 사례:
# - 식사 비용 항목 150000원 + 술 비용 항목 60000원 = 결제 내역 210000원.
# - 팀장의 찬조금 50000원을 식사에 전액 적용하기로 사용자가 확인했다고 가정.
# - 식사는 5명이 20000원씩, 술은 비주류자 1명을 제외한 4명이 15000원씩 부담.
# - 항목별 개인 부담액 합계 160000원 + 항목별 찬조금 적용 50000원 = 210000원.
# - 찬조자의 소비 분담 여부는 별도 결정한다. 찬조했다는 이유로 자동 제외하지 않는다.
# - 별도 예시: 술 비용 항목 60000원, 대상자 4명 중 한 명의 소비 몫을 6000원으로 합의하면
#   이 항목의 합의 소비 몫=6000, 나머지 3명에게 18000원씩 배정한다. 맥주 한 잔의 금액을 자동 산정한 예가 아니다.
#
# 기존안에서 제거/이동:
# - User -> 참여자: 앱 계정과 실제 참석자를 혼동하지 않도록 변경.
# - 모임 차수의 이전 excluded_members -> 차수별 참석 기록 + 비용 항목에 적용하는 ItemException.
# - 영수증의 이전 parsed_items -> 비용 항목 클래스 및 확인할 수 있는 비용 항목 관계.
# - 개인별 부담 조정의 이전 excluded_members_count -> 부담을 조정할 사람: Participant.
# - 개인별 부담 조정의 이전 item_name/amount -> Item.항목 이름/항목 금액으로 일원화.
#   이 항목의 합의 소비 몫은 항목 금액과 다른 '특정인의 합의 소비 부담액'이다.
# - 이전 ocr_total_amount -> 영수증에서 읽은 총금액. OCR은 원문에서 검증된 요구가 아닌 해결책 후보.
# - store_name은 핵심 원문에 명시 근거가 없어 이번 최소 속성에서 제외.
# - requires: 정산 재안내 제거. 모든 모임에 재요청이 필요한 것은 아니다.
# - 말투와 관계 맥락은 로그 17·18·20을 근거로 추가하되 3종 enum을 강제하지 않는다.
# - generated_text, 자동 카카오톡 발송, SettlementContext는 후속 구현 후보.
# - 찬조금 공제는 로그 18을 근거로 찬조금 + 항목별 찬조금 적용에 반영.
# 범위 밖: 은행 이체 자동 실행, 은행 자동 입금 조회, 카카오톡 자동 발송, 훼손 영수증 복원.
# 후속 가설: OCR/자연어 입력 -> 구조화 제안 -> 사용자 확인 -> 계산 엔진 -> 안내 문구 생성.
# 핵심 도메인 흐름: 참여자 + 결제 내역(영수증, 비용 항목) + 찬조금(항목별 찬조금 적용)
#                   -> 비용 나누는 기준 + 개인별 부담 조정
#                   -> 항목별 개인 부담액 -> 송금 요청 내역 -> 입금 확인 기록 -> 필요시 ReminderMessage.
