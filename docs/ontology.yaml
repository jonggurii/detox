        note: "한 메시지에 여러 청구를 담으면 debtor와 creditor가 각각 동일해야 한다."
        evidence: [로그 11, 로그 13, 로그 17, 로그 18, 로그 19]
      - recipient: Participant
        cardinality: "1"
        note: "for_result의 debtor와 일치한다."
        evidence: [로그 11, 로그 13, 로그 17, 로그 18, 로그 19]
      - sender: Participant
        cardinality: "0..1"
        note: "개인 메시지는 필수. 외부 서비스 알림에는 사람 발신자를 만들어 넣지 않는다."
        evidence: [로그 11, 로그 13, 로그 17, 로그 18, 로그 19]
      

# 구현 시 검증할 제약 — 아래는 인터뷰 문제에서 도출한 설계 제안이다.
# 1. 모든 관계 대상은 이 파일의 클래스이다. 연결된 객체는 같은 세션에 속해야 한다.
# 2. Expense에 연결된 Receipt와 Item 및 Round는 그 지출과 모순되어서는 안 된다.
# 3. 하나의 Item에는 하나의 유효 SplitRule이 있고, (Item, Participant)별 최종 Allocation은 하나다.
# 4. 먼저 찬조금 적용을 확정한다. 다음 exclude 대상자를 뺀다.
#    equal: fixed_amount 대상자의 합의액을 먼저 배정하고 잔액을 나머지 대상자에게 균등 분배한다.
#    explicit_amount: 확인된 개인별 금액을 입력하며 exclude 대상의 소비 몫은 0,
#    fixed_amount 대상의 소비 몫은 그 합의액과 같아야 한다. 예외를 금액에 다시 가감하지 않는다.
#    두 방식 모두 기본 소비 몫을 구한 뒤 covered_by_other로 해당 몫을 이전한다.
#    같은 사람·항목에 여러 kind를 중복 적용하거나 대신 부담의 순환·연쇄가 생기면 확인을 요청한다.
#    fixed_amount 합계가 분담 가능액보다 크거나, 잔액은 있으나 부담자가 없으면 확정할 수 없다.
#    한 잔 이용자의 부담액과 술값 추가 부담액은 사용자가 합의한 금액을 확인한다.
# 5. 확정 Item마다 Allocation.amount 합계 + 확정 ContributionAllocation.amount 합계 = Item.amount.
#    확정 Expense마다 Item.amount 합계 = Expense.total_amount.
#    Item.distributable_amount = Item.amount - 확정 ContributionAllocation.amount 합계 >= 0.
#    기본 대상자·확인된 대신 부담자 이외의 Allocation은 허용하지 않는다.
# 6. 1원 미만 몫은 부동소수점 오차 없이 계산하고, 원 단위 차액의 부담자를 확인한다.
#    소액 미청구도 비용의 소멸로 처리하지 않는다. 결제자 등이 흡수한 금액을 Allocation과 근거에 남긴다.
#    100원 반올림을 필수 정책으로 두지 않는다. 사용자 선택과 잔액 처리는 후속 스펙에서 확정한다.
# 7. 유효 청구는 (Expense, debtor, creditor)별 하나. creditor = Expense.paid_by, debtor != creditor.
#    based_on은 그 Expense와 debtor의 Allocation 전부에 정확히 대응해야 한다.
#    결제자 본인 몫 및 최종 부담액 0원의 참여자에게 송금을 청구하지 않는다.
# 8. 청구 금액 합계 + 결제자 본인 Allocation 합계 + 확정 찬조금 적용액 = Expense.total_amount.
#    여러 결제자의 지출은 각각 유지한다. 세션 전체 상계·최소 송금 최적화는 이번 모델의 필수가 아니다.
# 9. 검토 미완료 지출·미확정 규칙·미확정 예외・미확정 찬조금이 있으면 청구를 확정하지 않는다.
#    금액/날짜/이름이 비슷하다는 이유만으로 지출을 자동 삭제하지 않는다.
# 10. 완료 청구는 payment_status=confirmed여야 한다. confirmed는 담당자 대조로 확인된 입금만 합산한다.
#     하나의 실제 송금 내역을 여러 PaymentRecord에 대응시킬 때 대응 금액 합계가 실제 입금액을 넘으면 안 된다.
#     부분입금·초과입금·환불 처리의 상세 상태는 현 인터뷰만으로 확정하지 않는다.
# 11. 세션 완료는 모든 지출 검토 종료 + 유효 지출의 계산/청구 누락 없음 + 모든 유효 청구 완료로 판단한다.
#     입금 확인이 안 된 것을 실제 미입금으로 단정하지 않는다. 재요청 전 확인 상태와 약속 시점을 검토한다.
# 12. 청구 후 근거 금액을 바꿀 때 기존 요청/입금 연결을 조용히 덮어쓰지 않는다.
#     변경 이력·청구 버전·재안내 방식은 구현 스펙에서 정의한다.
# 13. 하나의 확정 Contribution.amount = 그 ContributionAllocation.amount 합계.
#     ContributionAllocation의 확정 여부는 연결된 Contribution.confirmation_status를 따른다.
#     ContributionAllocation.to_item은 Contribution.for_expense에 속해야 한다.
#     (Contribution, Item)별 유효 적용 기록은 하나이며 항목별 찬조금 합계는 항목 금액을 넘지 않는다.
#     식사/술에 찬조금을 적용하는 비율은 자동 추정하지 않는다. 동일 분담 대상/기준이면
#     전체 비용을 하나의 Item으로 표현할 수 있고, 대상/기준이 다르면 항목별 공제액을 확인한다.
# 14. 이 최소 모델에서는 지출 한 건의 결제자는 한 명이다. 찬조금의 자금 처리가 그 결제자에게
#     반영됨을 funding_note로 확인한다. 결제자 본인의 찬조라면 본인이 추가로 흡수한 금액이다.
#     찬조금 수령 경로는 원문에 없어 사용자 확인이 필요하다. 전달되지 않은 약속만으로 완료하지 않는다.
#     여러 결제자/지출에 걸친 공용 찬조금, 상점 직접 분할 결제는 자금 이동 모델의 후속 확장 범위이다.
#     같은 금액을 Contribution, Allocation, PaymentRecord에 중복 반영하지 않는다.
# 15. ReminderMessage.for_result의 debtor는 recipient와 일치해야 한다.
#     personal_message이면 sender와 text가 필수이며, 외부 알림 원문·발송 시각은 모르면 추정하지 않는다.
#     external_service_only인 청구에는 사용자의 처리 방식 변경 없이 개인 메시지를 추가하지 않는다.
#     로그 19는 기존 도구가 개인 재요청을 대체한 경계 증거로 보존하며 자동 알림을 필수 기능으로 정하지 않는다.
#
# 설계 예시 — 인터뷰의 실제 금액/계산 결과가 아닌 설명용 가상 사례:
# - 식사 Item 150000원 + 술 Item 60000원 = Expense 210000원.
# - 팀장 찬조 Contribution 50000원을 식사에 전액 적용하기로 사용자가 확인했다고 가정.
# - 식사는 5명이 20000원씩, 술은 비주류자 1명을 제외한 4명이 15000원씩 부담.
# - Allocation 합계 160000원 + ContributionAllocation 50000원 = 210000원.
# - 찬조자의 소비 분담 여부는 별도 결정한다. 찬조했다는 이유로 자동 제외하지 않는다.
# - 별도 예시: 술 Item 60000원, 대상자 4명 중 한 명의 소비 몫을 6000원으로 합의하면
#   fixed_amount=6000, 나머지 3명에게 18000원씩 배정한다. 맥주 한 잔의 금액을 자동 산정한 예가 아니다.
#
# 기존안에서 제거/이동:
# - User -> Participant: 앱 계정과 실제 참석자를 혼동하지 않도록 변경.
# - SettlementRound.excluded_members -> RoundParticipation + 항목별 ItemException.
# - Receipt.parsed_items -> Item 클래스 및 documents 관계.
# - ItemException.excluded_members_count -> affects: Participant.
# - ItemException.item_name/기존 amount -> Item.name/amount로 일원화.
#   새 fixed_amount는 품목 총액과 다른 '특정인의 합의 소비 부담액'이다.
# - ocr_total_amount -> recorded_total_amount. OCR은 원문에서 검증된 요구가 아닌 해결책 후보.
# - store_name은 핵심 원문에 명시 근거가 없어 이번 최소 속성에서 제외.
# - requires: ReminderMessage 제거. 모든 모임에 재요청이 필요한 것은 아니다.
# - 말투와 관계 맥락은 로그 17·18·20을 근거로 추가하되 3종 enum을 강제하지 않는다.
# - generated_text, 자동 카카오톡 발송, SettlementContext는 후속 구현 후보.
# - 찬조금 공제는 로그 18을 근거로 Contribution + ContributionAllocation에 반영.
# - 로그 19의 메뉴별 분담과 기존 서비스 알림 사용, 로그 20의 추가 부담 조정을 반영.
#
# 범위 밖: 은행 이체 자동 실행, 은행 자동 입금 조회, 카카오톡 자동 발송, 훼손 영수증 복원.
# 후속 가설: OCR/자연어 입력 -> 구조화 제안 -> 사용자 확인 -> 계산 엔진 -> 안내 문구 생성.
# 핵심 도메인 흐름: Participant + Expense(Receipt, Item) + Contribution(ContributionAllocation)
#                   -> SplitRule + ItemException
#                   -> Allocation -> SettlementResult -> PaymentRecord -> 필요시 ReminderMessage.
