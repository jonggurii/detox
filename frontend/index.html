<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>복합 N빵 정산</title><link rel="stylesheet" href="/frontend/style.css"></head><body><main><header><h1>복합 N빵 정산</h1><p>자연어 입력 → 조건 검토 → 정산 계산</p></header><section><h2>1. 정산 내용 입력</h2><label for="source">모임 정산 내용</label><textarea id="source" rows="5">1차는 민수, 철수, 영희가 참석했어. 식사비 6만원과 술값 2만4천원은 민수가 결제했고, 영희는 술값에서 제외해. 2차 노래방 3만원은 철수가 결제했고 민수와 철수만 참석했어.</textarea><button id="parse">Gemini로 분석하기</button></section><section id="review" hidden><h2>2. 파싱 결과 확인 및 수정</h2><p>Gemini가 추출한 조건을 확인하고 필요한 경우 JSON을 수정하세요. 수정 후에는 반드시 '수정 내용 검증'을 눌러주세요.</p><label for="context">RequestContext JSON</label><textarea id="context" rows="17" spellcheck="false"></textarea><div class="actions"><button id="validate">수정 내용 검증</button><label for="reviewer">확인자</label><input id="reviewer" placeholder="예: 총무" maxlength="100"><button id="confirm">조건 확정</button></div><h3>검토 결과</h3><ul id="issues"></ul></section><section id="result" hidden><h2>3. 정산 결과</h2><div id="totals"></div><h3>송금 요청</h3><div id="transfers"></div><details><summary>전체 계산 결과 JSON</summary><pre id="raw"></pre></details></section><p id="status" role="status" aria-live="polite"></p><footer>데모 버전: 서버를 재시작하면 세션이 삭제됩니다. 실제 계좌번호 등 민감정보는 입력하지 마세요.</footer></main><script src="/frontend/app.js"></script></body></html>
